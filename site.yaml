# クラリエ 記事サイトの設定。URL・連絡先・著者はここだけ直せば全ページに反映される。
site_name: クラリエ 生前整理・遺品整理ガイド
tagline: 生前整理・遺品整理・実家じまいの費用、手順、相続のことを、現場に立つ遺品整理士が解説する記事サイト
# 公開URL（第1段階：サブドメイン。第2段階で https://clarie.jp/guide に変える場合はここだけ変更）
base_url: https://guide.clarie.jp
brand_url: https://clarie.jp/
contact_url: https://clarie.jp/#contact
tel: 045-285-3751
tel_hours: 受付 9:00〜18:00（土日も対応）
test_url: https://clarie-jp.github.io/test/
company: 株式会社Improve
company_address: 神奈川県横浜市西区みなとみらい2-2-1 ランドマークプラザ5階
area: 神奈川・東京・千葉・埼玉
license: 古物商許可 神奈川県公安委員会 第452560006723号
author:
  name: 大西 司
  title: 遺品整理士・相続診断士
  bio: 株式会社Improve 経営戦略部本部長。古物・買取の現場で20年以上。マンション管理会社と提携した買取催事を年間100回以上運営し、生前整理・遺品整理の相談に日々対応している。
categories:
  ihin: 遺品整理
  seizen: 生前整理
  jikka: 実家じまい
  souzoku: 相続と手続き
  hiyou: 費用と相場
  kaitori: 買取と処分
  area: 地域別
  jirei: 現場の事例
# 1回の自動実行で生成する本数（GitHub Actions の cron で毎日実行）
posts_per_run: 3
# Googleマップへの投稿は1日何本までにするか（記事が多い日も、この本数だけ投稿する）
gbp_per_day: 2
# 4領域の生成比率。keywords.csv の domain 列（basic / area / case / item）に対応。合計1.0
mix:
  basic: 0.4
  area: 0.3
  case: 0.2
  item: 0.1
# true にすると、生成した記事を content/drafts に置き、確認してから content/posts に移す運用になる
review_before_publish: true

# ---- トップページ（LP）の文言。ここを直せばLPが変わる ----
lp:
  hero_title: 片付けの前に、知っておきたいことを。
  hero_sub: 遺品整理・生前整理・実家じまいの費用、手順、相続の順番。マンションの買取相談会で年間約2,000件の査定に立ち会う遺品整理士が、現場で聞かれることをそのまま記事にしています。読んで迷ったら、電話かフォームでご相談ください。
  # ヒーロー直下の「安心材料」。提携先の固有名は出さない（先方の承諾がないため）
  trust:
    - ["古物商許可", "神奈川県公安委員会 第452560006723号"]
    - ["有資格者が担当", "遺品整理士・相続診断士が在籍"]
    - ["年間2,000件超の査定実績", "上場企業グループの不動産管理会社と提携し、買取相談会を運営"]
    - ["見積り無料・追加請求なし", "お断りいただいても費用はかかりません"]
    - ["秘密厳守", "鍵のお預かり・写真報告にも対応"]
  pains:
    - title: 費用はいくらかかる？
      desc: 間取り別の目安、見積書の内訳、買取で安くなる仕組み
      category: hiyou
    - title: 自分でやる？頼む？
      desc: 家族だけで進める手順と、業者に頼んだほうがよい線引き
      category: ihin
    - title: 親にどう切り出す？
      desc: 嫌がられない声のかけ方、最初の一歩、残す・手放す・託す
      category: seizen
    - title: 実家をどうする？
      desc: 売る・貸す・残すの判断、相続の手続きの順番、空き家のこと
      category: jikka
  before:
    - 片付けの業者を、自分でさがす
    - 買取の業者を、また別にさがす
    - 不動産会社に、あらためて相談する
    - 相続の専門家を、さらにさがす
    - そのすべての間に、自分が立つ
  after:
    - 窓口は、クラリエひとつだけ
    - 整理の見積りを先に出し、買取額を費用から差し引く
    - 売却やリフォーム、相続の相談もそのまま手配
    - 遺品整理士・相続診断士・古物商の資格をもつ担当が最後まで
    - あなたは、待つだけでいい
  pricing:
    note: お品物の買取額を、この費用から差し引きます。価値あるお品物が多い場合は、ご負担がゼロになることや、差額をお受け取りいただけることもあります。お見積りは無料、お断りいただいても費用はかかりません。
    rows:
      - ["1K〜1LDK", "5", "単身・1〜2名で半日"]
      - ["2LDK〜3LDK", "7", "夫婦・家族の住まい、1日"]
      - ["戸建て", "10", "物置・庭・2階を含む、1〜2日"]
  steps:
    - ["お電話・フォーム", "状況をゆっくり伺います。相談は無料で、間取りと地域が分かれば概算もお伝えできます。"]
    - ["ご訪問・お見積り", "担当がご自宅に伺い、整理費用と買取できる品を同じ見積書でお出しします。金額の理由もひとつずつ説明します。"]
    - ["整理・買取", "資格をもつ担当がその場で査定し、買取額を整理費用にあてます。貴重品が出たら作業を止めてご報告します。"]
    - ["その先も、まとめて", "リフォーム・解体、不動産の売却、相続の相談まで、同じ窓口でご案内します。"]
  faq:
    - q: 相談だけでも、費用はかかりますか。
      a: かかりません。お見積りまで無料でご案内し、お断りいただいても費用は一切かかりません。相見積りの1社としてもご利用ください。
    - q: 遠方に住んでいますが、実家のことを相談できますか。
      a: ご相談いただけます。鍵のお預かりと写真でのご報告で進める方法があり、貴重品や形見の候補は作業を止めてご連絡します。
    - q: 買取できる物がなさそうです。
      a: ご本人が価値がないと思っている物に値段が付くことは珍しくありません。査定は無料ですので、判断する前に一度見せてください。値段が付かない物は処分の方法をご案内します。
    - q: 平日は仕事があります。土日でも相談できますか。
      a: 土日も対応しています。9:00から18:00のあいだでお電話ください。
    - q: まだ何を頼むか、決まっていません。
      a: 大丈夫です。状況をお聞きして、必要なことを一緒に整理するところから始めます。
