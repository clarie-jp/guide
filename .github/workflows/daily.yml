name: 記事の自動生成と公開

on:
  # 自動生成の cron は、記事の生成を毎回 大西さんに確認してから行う運用のため停止中（2026-11-09）。
  # 再開するときは下の2行のコメントを外す（毎日 06:10 JST = 21:10 UTC）。
  # schedule:
  #   - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "今回生成する本数（空なら site.yaml の設定）"
        required: false
        default: ""
      ping:
        description: "記事を作らず API 接続だけ確認する（true / 空）"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "scripts/**", "site.yaml", "static/**", "keywords.csv", "cases.csv", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  generate-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown

      - name: 記事を生成（cron と手動実行のときだけ）
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.ping }}" = "true" ]; then
            python3 scripts/generate.py --ping
          elif [ -n "${{ github.event.inputs.count }}" ]; then
            python3 scripts/generate.py --count "${{ github.event.inputs.count }}"
          else
            python3 scripts/generate.py
          fi

      - name: 生成した記事をコミット
        if: github.event_name != 'push'
        run: |
          git config user.name "clarie-bot"
          git config user.email "bot@clarie.jp"
          git add content keywords.csv cases.csv
          git diff --cached --quiet || git commit -m "記事を自動生成 $(date -u +%Y-%m-%d)"
          git push

      - name: サイトをビルド
        run: python3 scripts/build.py

      # お名前.com レンタルサーバーへ SSH（鍵認証）で差分転送。
      # Secrets: SSH_HOST（www1222.onamae.ne.jp）, SSH_PORT（8022）, SSH_USER（r3199320）, SSH_KEY（秘密鍵の中身）, DEPLOY_PATH（/home/r3199320/public_html/guide.clarie.jp/）
      - name: サーバーへ転送（rsync over SSH）
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "-rlgoDzvc -i --delete"
