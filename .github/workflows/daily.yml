name: 記事の自動生成と公開

on:
  # 毎朝 06:10 JST：記事の「生成」はしない。公開日が来た記事をビルドして公開するだけ。
  # 記事の生成は、大西さんの確認を取ってから手動実行（workflow_dispatch）でのみ行う。
  schedule:
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "今回生成する本数（空なら site.yaml の設定）"
        required: false
        default: ""
      ping:
        description: "記事を作らず API 接続だけ確認する（true / 空）"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "scripts/**", "site.yaml", "static/**", "keywords.csv", "cases.csv", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  generate-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown

      - name: 記事を生成（手動実行のときだけ）
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.ping }}" = "true" ]; then
            python3 scripts/generate.py --ping
          elif [ -n "${{ github.event.inputs.count }}" ]; then
            python3 scripts/generate.py --count "${{ github.event.inputs.count }}"
          else
            python3 scripts/generate.py
          fi

      - name: 生成した記事をコミット
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "clarie-bot"
          git config user.email "bot@clarie.jp"
          git add content keywords.csv cases.csv
          git diff --cached --quiet || git commit -m "記事を自動生成 $(date -u +%Y-%m-%d)"
          git push

      - name: サイトをビルド
        run: python3 scripts/build.py

      # お名前.com レンタルサーバーへ SSH（鍵認証）で差分転送。
      # Secrets: SSH_HOST（www1222.onamae.ne.jp）, SSH_PORT（8022）, SSH_USER（r3199320）, SSH_KEY（秘密鍵の中身）, DEPLOY_PATH（/home/r3199320/public_html/guide.clarie.jp/）
      - name: サーバーへ転送（rsync over SSH）
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: "-rlgoDzvc -i --delete"

      # 公開後の確認：本番URL（https://guide.clarie.jp/）で、公開日が来た記事がすべて表示されているかを確かめる。
      # 1本でも出ていなければ、この実行を「失敗」にして気づけるようにする。
      - name: 本番URLで公開を確認
        run: |
          sleep 20
          python3 - <<'PY'
          import re, sys, urllib.request, pathlib, datetime
          base = "https://guide.clarie.jp"
          today = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=9)).date().isoformat()
          slugs = []
          for f in sorted(pathlib.Path("content/posts").glob("*.md")):
              t = f.read_text(encoding="utf-8")
              d = re.search(r"^date:\s*'?([0-9-]+)", t, re.M).group(1)
              s = re.search(r"^slug:\s*(\S+)", t, re.M).group(1)
              if d <= today: slugs.append((d, s))
          slugs.sort(reverse=True)
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"Cache-Control": "no-cache"}), timeout=30)
              return r.status, r.read().decode("utf-8", "replace")
          bad = []
          st, top = get(base + "/")
          for d, s in slugs[:3]:
              if s not in top: bad.append(f"トップの新着に出ていない: {s}")
          for d, s in slugs:
              st, _ = get(f"{base}/posts/{s}/")
              if st != 200: bad.append(f"記事が開けない({st}): {s}")
          print(f"確認した記事: {len(slugs)}本（本日 {today}）")
          for d, s in slugs[:3]: print(f"  新着: {d} {s}")
          if bad:
              print("NG"); print("\n".join(bad)); sys.exit(1)
          print("OK: 本番URLで全記事の公開を確認")
          PY
